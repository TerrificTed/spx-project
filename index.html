function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function open_(raw){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},k,ub(D.c));try{sessionStorage.setItem('wk',b64(new Uint8Array(raw)))}catch(e){}var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
async function derive(pw){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(D.s),iterations:D.n,hash:'SHA-256'},km,256))}
